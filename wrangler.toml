# Cloudflare Workers (OpenNext). Deploy: npm run build && npx wrangler deploy
# Free workers.dev / pages-style URL — no custom domain required.
# Set secrets in the Cloudflare dashboard (never commit): DATABASE_URL

name = "babyalestock"
main = ".open-next/worker.js"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
upload_source_maps = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "babyalestock"

[observability]
enabled = true

[vars]
# Non-secret flags only. DATABASE_URL must be a Secret.
BABYALESTOCK_SECURE_COOKIE = "1"
