# Cloudflare Pages project "babyalestock" (OpenNext Advanced Mode).
# Build:  npm run build
# Deploy: npx wrangler pages deploy .open-next --project-name=babyalestock --branch=main
#
# Production URL:  https://babyalestock.pages.dev
# Preview URL:     https://<hash>.babyalestock.pages.dev
#
# Secrets in the Cloudflare dashboard (never commit): DATABASE_URL
# Do NOT use `npx wrangler deploy` (Workers) for this Pages project.

name = "babyalestock"
pages_build_output_dir = ".open-next"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[vars]
BABYALESTOCK_SECURE_COOKIE = "1"
