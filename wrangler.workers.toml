# Fallback: Cloudflare Workers (if Pages Git keeps disconnecting).
# Build:  npm run build
# Deploy: npx wrangler deploy -c wrangler.workers.toml
#
# Live URL: https://babyalestock.<account-subdomain>.workers.dev
#
# DATABASE_URL must be a Worker RUNTIME secret (dashboard):
#   Settings → Variables and Secrets → Production → Secret DATABASE_URL
# Build-only vars and Previews Base alone do NOT bind into main / version
# preview URLs of a main deploy. After adding the secret, redeploy main tip.

name = "babyalestock"
main = ".open-next/worker.js"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
upload_source_maps = true
workers_dev = true
preview_urls = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "babyalestock"

[observability]
enabled = true

[vars]
BABYALESTOCK_SECURE_COOKIE = "1"
